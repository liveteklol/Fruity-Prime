plugins {
    id "com.android.application"
}

def nativeVersionName = System.getenv("FRUITY_ANDROID_VERSION_NAME") ?: "0.0.0-dev"
def nativeVersionCodeText = System.getenv("FRUITY_ANDROID_VERSION_CODE") ?: "1"
// The shared C# contract stays at 26; this Qt 6.11 native head needs API 28.
def nativeMinSdk = Math.max(28, Integer.parseInt(System.getenv("ANDROID_MIN_API") ?: "28"))
def generatedAssetsDir = file("$buildDir/generated/fruityAssets")
def generatedResourcesDir = file("$buildDir/generated/fruityResources")

android {
    namespace "fr.livetek.fruityprime"
    compileSdk 35

    defaultConfig {
        applicationId "fr.livetek.fruityprime"
        minSdk nativeMinSdk
        targetSdk 35
        versionCode Integer.parseInt(nativeVersionCodeText)
        versionName nativeVersionName
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["../qt-generated/libs"]
            res.srcDirs = ["src/main/res", generatedResourcesDir, "../qt-generated/res"]
            assets.srcDir(generatedAssetsDir)
            assets.srcDir("../qt-generated/assets")
            java.srcDir("../qt-generated/src")
        }
    }

    // A release is signed with the key every published APK (C# ones
    // included) carries, which is what lets the in-app updater install it
    // over them. CI sets these from the ANDROID_KEYSTORE* secrets.
    def releaseKeystore = System.getenv("FRUITY_ANDROID_KEYSTORE")
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("FRUITY_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FRUITY_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("FRUITY_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            // Without the release key (any build that is not a release): the
            // cached development key, so successive beta builds can at least
            // update each other.
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

tasks.register("syncFruityAssets", Sync) {
    into(generatedAssetsDir)
    from("../../src/MphRead/Assets") {
        into("Assets")
        include("*.png")
        include("Fonts/*.ttf")
        include("Backgrounds/*.jpg")
        include("Geo/*.gz")
    }
    from("../../maps") {
        into("maps")
        include("*.json")
        include("*.bsp")
        include("*.tex")
        include("*.fpmap")
    }
}

tasks.register("syncFruityResources", Sync) {
    into(generatedResourcesDir)
    from("../../src/MphRead.Android/Resources") {
        exclude("values/styles.xml")
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncFruityAssets", "syncFruityResources")
}

dependencies {
    implementation fileTree(dir: "../qt-generated/libs", include: ["*.jar"])
    implementation "androidx.core:core:1.15.0"
}

name: Native C++ Linux / GCC

on:
  # build_cpp.yml calls this on every push and PR; firing it here too
  # built the same commit twice.
  # push:
  #   branches: [develop2]
  #   paths:
  #     - "CMakeLists.txt"
  #     - "cmake/**"
  #     - "src/MphRead.Native/**"
  #     - "src/NcsfPlay.Native/**"
  #     - ".github/workflows/native-cpp-linux.yml"
  # pull_request:
  #   branches: [develop2]
  #   paths:
  #     - "CMakeLists.txt"
  #     - "cmake/**"
  #     - "src/MphRead.Native/**"
  #     - "src/NcsfPlay.Native/**"
  #     - ".github/workflows/native-cpp-linux.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  APT_CACHE_DIR: ${{ github.workspace }}/.cache/apt/archives
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

jobs:
  linux-native:
    name: Linux / GCC
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify GCC toolchain
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          cmake --version

      - name: Resolve apt dependency cache key
        id: apt-deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          versions="$(apt-cache policy autoconf autoconf-archive automake libtool libarchive-dev libcurl4-openssl-dev zlib1g-dev libgl-dev libglx-dev libopengl-dev libglfw3-dev libfreetype-dev libjpeg-dev libopenal-dev libicu-dev)"
          printf "%s\n" "$versions"
          digest="$(printf "%s" "$versions" | sha256sum | cut -d" " -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache
        id: apt-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: native-apt-v1-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.apt-deps.outputs.digest }}-${{ hashFiles('.github/workflows/native-cpp-linux.yml') }}
          restore-keys: |
            native-apt-v1-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.apt-deps.outputs.digest }}-
            native-apt-v1-${{ runner.os }}-${{ runner.arch }}-gcc-

      - name: Report apt cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          printf "apt package cache exact hit: %s\n" "${CACHE_HIT:-false}"

      - name: Install native dependencies on Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APT_CACHE_DIR/partial"
          sudo apt-get -o Dir::Cache::archives="$APT_CACHE_DIR" install -y --no-install-recommends autoconf autoconf-archive automake libtool libarchive-dev libcurl4-openssl-dev zlib1g-dev libgl-dev libglx-dev libopengl-dev libglfw3-dev libfreetype-dev libjpeg-dev libopenal-dev libicu-dev
          sudo rm -f "$APT_CACHE_DIR/lock"
          sudo rm -rf "$APT_CACHE_DIR/partial"
          sudo chown -R "$(id -u):$(id -g)" "$APT_CACHE_DIR"

      - name: Save apt package cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: native-apt-v1-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.apt-deps.outputs.digest }}-${{ hashFiles('.github/workflows/native-cpp-linux.yml') }}

      - name: Locate vcpkg
        id: vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VCPKG_INSTALLATION_ROOT:-}" && -x "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]]; then
            root="${VCPKG_INSTALLATION_ROOT}"
          else
            root="${RUNNER_TEMP}/vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$root"
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      # Native dependencies use vcpkg's binary
      # cache turns it into an unzip whenever the port's ABI hash is unchanged.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.vcpkg.outputs.commit }}
          restore-keys: |
            native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-gcc-

      - name: Install native dependencies on Linux
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.vcpkg.outputs.root }}"
          "$root/vcpkg" install "vulkan-memory-allocator:x64-linux" --clean-after-build
          echo "FRUITY_NATIVE_PREFIX=$root/installed/x64-linux" >> "$GITHUB_ENV"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-gcc-${{ steps.vcpkg.outputs.commit }}

      # Object-file cache for our own sources: an unchanged translation unit
      # is not recompiled on the next push.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-gcc
          max-size: 1G

      - name: Install Qt Quick
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y p7zip-full libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          python3 tools/qt/install-qt.py --kit gcc_64 --root "$RUNNER_TEMP/qt"
          echo "QT_ROOT=$RUNNER_TEMP/qt/6.11.2/gcc_64" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/qt/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Configure with GCC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native
          cmake -S . -B build/native \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${QT_ROOT};${FRUITY_NATIVE_PREFIX};${CMAKE_PREFIX_PATH:-}" 2>&1 | tee build/native/configure.log

      - name: Build shared native owners
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native \
            --config RelWithDebInfo \
            --parallel "$(nproc)" \
            --verbose \
            --target fruity_ncsfplay_native fruity_mphread_native 2>&1 | tee build/native/build.log

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-cpp-gcc-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/native/CMakeCache.txt
            build/native/CMakeFiles/CMakeConfigureLog.yaml
            build/native/configure.log
            build/native/build.log
            build/native/**/*.a
            build/native/**/*.lib

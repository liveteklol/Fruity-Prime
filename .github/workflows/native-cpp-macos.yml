name: Native C++ macOS / Clang

on:
  # build_cpp.yml calls this on every push and PR; firing it here too
  # built the same commit twice.
  # push:
  #   branches: [develop2]
  #   paths:
  #     - "CMakeLists.txt"
  #     - "cmake/**"
  #     - "src/MphRead.Native/**"
  #     - "src/NcsfPlay.Native/**"
  #     - ".github/workflows/native-cpp-macos.yml"
  # pull_request:
  #   branches: [develop2]
  #   paths:
  #     - "CMakeLists.txt"
  #     - "cmake/**"
  #     - "src/MphRead.Native/**"
  #     - "src/NcsfPlay.Native/**"
  #     - ".github/workflows/native-cpp-macos.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

jobs:
  macos-native:
    name: macOS / Clang
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Homebrew download cache
        id: homebrew-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: native-homebrew-v1-${{ runner.os }}-${{ runner.arch }}-clang-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.github/workflows/native-cpp-macos.yml') }}
          restore-keys: |
            native-homebrew-v1-${{ runner.os }}-${{ runner.arch }}-clang-

      - name: Report Homebrew cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.homebrew-cache.outputs.cache-hit }}
        run: |
          printf "Homebrew download cache exact hit: %s\n" "${CACHE_HIT:-false}"

      - name: Verify Clang toolchain
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          cmake --version

      - name: Install native dependencies on macOS
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf autoconf-archive automake libtool curl libarchive zlib glfw freetype jpeg-turbo openal-soft
          echo "CMAKE_PREFIX_PATH=$(brew --prefix curl);$(brew --prefix libarchive);$(brew --prefix zlib);$(brew --prefix glfw);$(brew --prefix jpeg-turbo);$(brew --prefix openal-soft)" >> "$GITHUB_ENV"

      - name: Save Homebrew download cache
        if: steps.homebrew-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: native-homebrew-v1-${{ runner.os }}-${{ runner.arch }}-clang-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.github/workflows/native-cpp-macos.yml') }}

      - name: Locate vcpkg
        id: vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VCPKG_INSTALLATION_ROOT:-}" && -x "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]]; then
            root="${VCPKG_INSTALLATION_ROOT}"
          else
            root="${RUNNER_TEMP}/vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$root"
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      # Native dependencies use vcpkg's binary
      # cache turns it into an unzip whenever the port's ABI hash is unchanged.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-clang-${{ steps.vcpkg.outputs.commit }}
          restore-keys: |
            native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-clang-

      - name: Install native dependencies on macOS
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.vcpkg.outputs.root }}"
          if [[ "$(uname -m)" == "arm64" ]]; then
            triplet="arm64-osx"
          else
            triplet="x64-osx"
          fi
          true # Qt supplies the UI dependencies
          echo "FRUITY_NATIVE_PREFIX=$root/installed/$triplet" >> "$GITHUB_ENV"

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-clang-${{ steps.vcpkg.outputs.commit }}

      # Object-file cache for our own sources: an unchanged translation unit
      # is not recompiled on the next push.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-clang
          max-size: 1G

      - name: Install Qt Quick
        shell: bash
        run: |
          set -euo pipefail
          brew install sevenzip
          python3 tools/qt/install-qt.py --kit clang_64 --root "$RUNNER_TEMP/qt"
          echo "QT_ROOT=$RUNNER_TEMP/qt/6.11.2/clang_64" >> "$GITHUB_ENV"

      - name: Configure with Clang
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native
          cmake -S . -B build/native \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${QT_ROOT};${FRUITY_NATIVE_PREFIX};${CMAKE_PREFIX_PATH:-}" 2>&1 | tee build/native/configure.log

      - name: Build shared native owners
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native \
            --config RelWithDebInfo \
            --parallel "$(sysctl -n hw.ncpu)" \
            --verbose \
            --target fruity_ncsfplay_native fruity_mphread_native 2>&1 | tee build/native/build.log

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-cpp-clang-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/native/CMakeCache.txt
            build/native/CMakeFiles/CMakeConfigureLog.yaml
            build/native/configure.log
            build/native/build.log
            build/native/**/*.a
            build/native/**/*.lib

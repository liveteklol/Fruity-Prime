# Package a tagged commit of the C++ port.
#
#   git tag v0.11.0 && git push origin v0.11.0
#
# Or, from the Actions tab: give an existing tag, or leave it empty and pick a
# bump to have the next tag created here (a tag pushed with the default
# GITHUB_TOKEN would not trigger this workflow, so it mints its own).
#
# v* tags, continuing the numbers the C# releases used (v0.10.0 was the last):
# every server running today is a C# build that updates itself from GitHub's
# latest release, and it only reads a plain vMAJOR.MINOR.PATCH tag that is
# newer than its own, with a `server-linux-x64` / `server-linux-arm64`
# package. That is how this release reaches the servers and the directory
# without anybody logging in to them, and why the tag, the asset names and the
# server packages below are not cosmetic. A cpp_v tag is still accepted and
# turned into the v tag at the same commit.
#
# What it leaves is a *draft*; publishing is a person pressing the button, and
# the servers start updating within ten minutes of it (each one swaps when it
# is empty). Do not mark it a pre-release: releases/latest skips those.
name: release_cpp

on:
  push:
    tags: ["v*", "cpp_v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.11.0 (leave empty to bump instead)
        required: false
      bump:
        description: Create the next v tag from the newest one, when no tag is given
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - name: resolve the tag
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          BUMP: ${{ github.event.inputs.bump }}
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$PUSHED_TAG}"
          RELEASE_TAG='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'

          if [ -n "$TAG" ]; then
            SOURCE="$TAG"
            case "$TAG" in
              cpp_v*) TAG="${TAG#cpp_}" ;;
              v*) ;;
              *) TAG="v$TAG" ;;
            esac
            if [[ ! "$TAG" =~ $RELEASE_TAG ]]; then
              echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH (components 0-999, no leading zeroes)."
              exit 1
            fi
            if ! gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              # A pushed cpp_vX.Y.Z becomes vX.Y.Z at the same commit.
              if [ "$SOURCE" != "$TAG" ] && gh api "repos/$REPO/git/ref/tags/$SOURCE" >/dev/null 2>&1; then
                COMMIT=$(gh api "repos/$REPO/commits/$SOURCE" --jq .sha)
                gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" >/dev/null
                echo "Created $TAG at ${COMMIT:0:7}, from $SOURCE."
              else
                echo "::error::No tag '$TAG' exists in $REPO. Push one first:"
                echo "::error::  git tag $TAG && git push origin $TAG"
                exit 1
              fi
            fi
          elif [ "${BUMP:-none}" != none ]; then
            LATEST=$(gh api "repos/$REPO/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null \
              | sed 's#^refs/tags/##' | grep -E "$RELEASE_TAG" \
              | sed 's/^v//' | sort -V | tail -1 || true)
            if [ -z "$LATEST" ]; then
              TAG=v0.1.0
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
              case "$BUMP" in
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                patch) PATCH=$((PATCH + 1)) ;;
              esac
              TAG="v$MAJOR.$MINOR.$PATCH"
            fi
            if [[ ! "$TAG" =~ $RELEASE_TAG ]]; then
              echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH."
              exit 1
            fi
            if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already exists. Build it by name, or bump past it."
              exit 1
            fi
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            echo "Created $TAG at ${SHA:0:7}."
          else
            echo "::error::Give a tag to build, or pick a bump to create the next one."
            exit 1
          fi

          # The updaters only move forward. A release numbered at or below
          # the published one would be ignored by every server and client.
          VERSION="${TAG#v}"
          PUBLISHED=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          PUBLISHED="${PUBLISHED#v}"
          if [[ "$PUBLISHED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$PUBLISHED" != "$VERSION" ] \
             && [ "$(printf '%s\n%s\n' "$PUBLISHED" "$VERSION" | sort -V | tail -1)" = "$PUBLISHED" ]; then
            echo "::error::$TAG is not newer than the published v$PUBLISHED; nothing would update to it."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Fruity Prime $TAG" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    uses: ./.github/workflows/build_cpp.yml
    with:
      checkout_ref: refs/tags/${{ needs.resolve.outputs.tag }}
      release_version: ${{ needs.resolve.outputs.version }}

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FruityPrime-cpp-*
          path: artifacts

      # The names carry the runtime identifiers the updaters match on:
      # win-x64 / linux-x64 / osx-arm64 for players, server-linux-* for the
      # servers. A name without "-server-" is never picked by a server.
      - name: package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/FruityPrime-cpp-*; do
            kind=$(basename "$dir" | sed -E 's/-[0-9]+$//')
            case "$kind" in
              FruityPrime-cpp-windows)
                ( cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/FruityPrime-$TAG-win-x64.zip" . ) ;;
              FruityPrime-cpp-linux)
                cp "$dir/FruityPrime-linux.tar.gz" "dist/FruityPrime-$TAG-linux-x64.tar.gz" ;;
              FruityPrime-cpp-macos)
                cp "$dir/FruityPrime-macos.tar.gz" "dist/FruityPrime-$TAG-osx-arm64.tar.gz" ;;
              FruityPrime-cpp-android)
                cp "$dir/FruityPrime.apk" "dist/FruityPrime-$TAG-android.apk" ;;
              FruityPrime-cpp-server-linux-x64)
                cp "$dir/FruityPrime-server-linux-x64.tar.gz" "dist/FruityPrime-$TAG-server-linux-x64.tar.gz" ;;
              FruityPrime-cpp-server-linux-arm64)
                cp "$dir/FruityPrime-server-linux-arm64.tar.gz" "dist/FruityPrime-$TAG-server-linux-arm64.tar.gz" ;;
              *)
                echo "::warning::$kind is not part of a release" ;;
            esac
          done
          # Without these the servers and the directory stay on the old build,
          # refusing every player who updated.
          for package in server-linux-x64.tar.gz server-linux-arm64.tar.gz \
                         linux-x64.tar.gz win-x64.zip; do
            test -f "dist/FruityPrime-$TAG-$package" \
              || { echo "::error::the release has no $package"; exit 1; }
          done
          ls -la dist

      # Rerunning the same tag updates the draft rather than failing.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTE'
          **Beta build of the C++ port.** You bring your own Metroid Prime Hunters cartridge
          dump; no game data is included here and none is downloaded.

          - **Windows** -- the `win-x64` zip, run `bin\FruityPrime.exe`
          - **Linux** -- the `linux-x64` tarball, run `bin/FruityPrime`
          - **macOS** -- the `osx-arm64` tarball, open `FruityPrime.app`
          - **Android** -- the `android` APK; it contains arm64-v8a and x86_64 native libraries
          - **Dedicated server** -- the `server-linux-x64` / `server-linux-arm64` tarball, run
            `./FruityPrime -server`; see SERVER.md inside. Servers already running update
            themselves to it.
          NOTE
          CHANGES=$(gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body 2>/dev/null || true)
          if [ -n "$CHANGES" ]; then
            printf '\n---\n\n%s\n' "$CHANGES" >> notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Fruity Prime $TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "Fruity Prime $TAG" --notes-file notes.md
          fi

# Build, audit and package artifacts for desktop and Android C++.
name: build_cpp

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or commit to build (empty uses the current commit)
        required: false
        type: string
        default: ""
      release_version:
        description: MAJOR.MINOR.PATCH to stamp into the build (empty for an unstamped build)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""
      # release_cpp.yml passes the tag's version. A build without one calls
      # itself a local build, and its updater never replaces it.
      release_version:
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One run per branch and per event: a newer push makes an older run's result
# worthless. The push and the pull_request run of the same commit stay in
# separate groups: sharing one, the PR run cancelled the push run on every
# push, and the PR showed a cancelled build each time. (The PR run builds the
# merge with the base branch, so it is not the same build anyway.)
concurrency:
  group: build_cpp-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.checkout_ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  FRUITY_RELEASE_VERSION: ${{ inputs.release_version }}

jobs:
  phase4_legacy_gl_audit:
    name: phase4 / legacy OpenGL static audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Reject display lists and immediate vertex submission
        run: python3 tools/check-phase4-legacy-gl.py

  phase5_shader_interface_audit:
    name: phase5 / shader interface static audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Reject built-in vertex attributes and a drifted shader interface
        run: python3 tools/check-phase5-shader-interface.py

  phase9_frontend_gl_audit:
    name: phase9 / frontend OpenGL static audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Reject direct OpenGL in the renderer frontend
        run: python3 tools/check-phase9-frontend-gl.py

  phase11_gl_boundary_audit:
    name: phase11 / OpenGL dependency classification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Reject unclassified OpenGL dependencies
        run: |
          python3 tools/test-phase11-gl-boundaries.py
          python3 tools/check-phase11-gl-boundaries.py

  phase26_rhi_isolation_audit:
    name: phase26 / RHI backend isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Native GL and Vulkan only inside their backends
        run: python3 tools/check-rhi-isolation.py

  windows:
    name: Windows / MSVC
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up MSVC environment for Ninja
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up pinned Windows vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "fruity-vcpkg"
          git init $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          git -C $root fetch --depth 1 origin 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $root checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VCPKG_ROOT = $root
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_INSTALLATION_ROOT=$root" >> $env:GITHUB_ENV
          "commit=$(git -C $root rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          "compiler=$((Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
          & "$root/vcpkg.exe" version

      # Separate archives by pinned ports, compiler and dependency recipe.
      - name: Cache vcpkg binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-windows-v2-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-${{ hashFiles('tools/ci/dependencies/windows-game.txt') }}
          restore-keys: |
            native-vcpkg-windows-v2-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-
            native-vcpkg-all-${{ runner.os }}-${{ runner.arch }}-
            native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install native dependencies
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on the runner."
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            throw "vcpkg.exe was not found at $vcpkg"
          }
          $packages = @(Get-Content tools/ci/dependencies/windows-game.txt | Where-Object { $_.Trim() })
          & $vcpkg install @packages --clean-after-build 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/vcpkg-install.log"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Save before the long game build so cancellation does not lose dependencies.
      - name: Save vcpkg binary archives after install
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-vcpkg-windows-v2-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-${{ hashFiles('tools/ci/dependencies/windows-game.txt') }}

      - name: Upload dependency cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-cache-windows-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/vcpkg-install.log
            ${{ runner.temp }}/fruity-vcpkg/installed/x64-windows/share/*/vcpkg_abi_info.txt

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Qt Quick for MSVC
        shell: pwsh
        run: |
          python tools/qt/install-qt.py --kit msvc2022_64 --root "$env:RUNNER_TEMP/qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "QT_ROOT=$env:RUNNER_TEMP/qt/6.11.2/msvc2022_64" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/native -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DQt6_ROOT="$env:QT_ROOT" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DFRUITY_REQUIRE_VULKAN=ON `
            -DFRUITY_RELEASE_VERSION="$env:FRUITY_RELEASE_VERSION" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build C++ FruityPrime
        shell: pwsh
        run: |
          cmake --build build/native --config RelWithDebInfo --parallel $env:NUMBER_OF_PROCESSORS --target fruity_package
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Reflex lifecycle, input and Dialanche regression
        shell: pwsh
        run: |
          cmake --build build/native --config RelWithDebInfo --target fruity_vulkan_reflex_tests fruity_raw_mouse_motion_tests fruity_native_touch_state_tests fruity_native_aim_rules_tests fruity_dialanche_native_collision_tests fruity_weavel_alt_form_parity_tests fruity_intent_touch_payload_tests fruity_windows_raw_mouse_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/native -C RelWithDebInfo -R '^FruityPrime\.(VulkanNvidiaReflex|RawMouseMotion|NativeTouchState|NativeAimRules|DialancheNativeCollision|WeavelAltFormParity|IntentTouchPayload|WindowsRawMouseInput)$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Backend contract (OpenGL, Vulkan, Qt Quick)
        shell: pwsh
        run: |
          # One binary carries both backends; this says so without a GPU.
          $contract = Join-Path $PWD 'rhi-contract.txt'
          $process = Start-Process -FilePath build/native/RelWithDebInfo/FruityPrime.exe `
            -ArgumentList '-rhicontract', $contract, '-noupdate' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "-rhicontract exited $($process.ExitCode)" }
          Get-Content $contract
          foreach ($line in 'opengl=compiled', 'vulkan=compiled', 'vulkan-shader-stages=10', 'ui=qt') {
            if (-not (Select-String -Path $contract -SimpleMatch $line -Quiet)) { throw "backend contract is missing $line" }
          }

      - name: Report compiler cache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-windows-${{ github.run_number }}
          if-no-files-found: error
          path: build/native/dist/

  linux:
    name: Linux / GCC
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      # Pin ports/tools so runner updates preserve the native dependency ABI.
      - name: Set up pinned vcpkg
        id: vcpkg
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fruity-vcpkg"
          git init "$root"
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --depth 1 origin 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
          git -C "$root" checkout --detach FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "compiler=$(sha256sum /usr/bin/g++ | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          "$root/vcpkg" version
          g++ --version

      # Reuse one archive per pinned dependency/toolchain set, rather than per run.
      - name: Cache vcpkg binary archives
        id: native-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-${{ hashFiles('tools/ci/dependencies/linux.txt') }}
          restore-keys: |
            native-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-
            native-vcpkg-all-${{ runner.os }}-${{ runner.arch }}-
            native-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libvulkan-dev \
            glslc \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            openbox \
            xvfb \
            xauth \
            cmake \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libarchive-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libgl-dev \
            libglx-dev \
            libopengl-dev \
            libglfw3-dev \
            libxcb1-dev \
            libwayland-dev \
            libfreetype-dev \
            libopenal-dev \
            libicu-dev

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.vcpkg.outputs.root }}"
          mapfile -t packages < tools/ci/dependencies/linux.txt
          "$root/vcpkg" install "${packages[@]}" --clean-after-build 2>&1 | tee "$RUNNER_TEMP/native-deps-install.log"
          echo "FRUITY_NATIVE_PREFIX=$root/installed/x64-linux" >> "$GITHUB_ENV"

      - name: Save native dependency cache immediately after install
        if: steps.native-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-${{ hashFiles('tools/ci/dependencies/linux.txt') }}

      - name: Upload native dependency cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-deps-cache-linux-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/native-deps-install.log
            ${{ steps.vcpkg.outputs.root }}/installed/x64-linux/share/*/vcpkg_abi_info.txt

      # Refresh immutable snapshots weekly; avoid a full duplicate on every push.
      - name: Select compiler cache generation
        shell: bash
        run: echo "COMPILER_CACHE_WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-gcc-game-${{ env.COMPILER_CACHE_WEEK }}
          max-size: 500M
          append-timestamp: false

      - name: Install Qt Quick
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y p7zip-full libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
          python3 tools/qt/install-qt.py --kit gcc_64 --root "$RUNNER_TEMP/qt"
          echo "QT_ROOT=$RUNNER_TEMP/qt/6.11.2/gcc_64" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/qt/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/qt/6.11.2/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$RUNNER_TEMP/qt/6.11.2/gcc_64/plugins/platforms/libqxcb.so" | tee "$RUNNER_TEMP/qt-xcb-dependencies.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/qt-xcb-dependencies.txt"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${QT_ROOT};${FRUITY_NATIVE_PREFIX}" -DFRUITY_REQUIRE_VULKAN=ON \
            -DFRUITY_RELEASE_VERSION="${FRUITY_RELEASE_VERSION}"

      - name: Build C++ FruityPrime
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native --config RelWithDebInfo --parallel "$(nproc)" --target fruity_package

      - name: Reflex lifecycle, raw mouse and Morph Ball input regression
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native --config RelWithDebInfo --target fruity_vulkan_reflex_tests fruity_raw_mouse_motion_tests fruity_native_touch_state_tests fruity_native_aim_rules_tests fruity_dialanche_native_collision_tests fruity_weavel_alt_form_parity_tests fruity_intent_touch_payload_tests
          ctest --test-dir build/native -C RelWithDebInfo -R '^FruityPrime\.(VulkanNvidiaReflex|RawMouseMotion|NativeTouchState|NativeAimRules|DialancheNativeCollision|WeavelAltFormParity|IntentTouchPayload)$' --output-on-failure --no-tests=error

      - name: Backend contract (OpenGL, Vulkan, Qt Quick)
        shell: bash
        run: |
          set -euo pipefail
          build/native/FruityPrime -rhicontract build/native/rhi-contract.txt -noupdate
          cat build/native/rhi-contract.txt
          for line in opengl=compiled vulkan=compiled vulkan-shader-stages=10 ui=qt; do
            grep -qxF "$line" build/native/rhi-contract.txt || { echo "backend contract is missing $line" >&2; exit 1; }
          done

      - name: SPIR-V is regenerated reproducibly
        shell: bash
        run: |
          set -euo pipefail
          # The shaders are generated from Shaders.cpp in every build (none is
          # committed); two independent generations must match each other
          # and the build's own, word for word.
          glslc="$(grep -E '^FRUITY_GLSLC:' build/native/CMakeCache.txt | cut -d= -f2-)"
          for run in a b; do
            python3 tools/generate-vulkan-scene-shaders.py --source src/MphRead.Native/Shaders.cpp --output "$RUNNER_TEMP/spirv-$run"
            for source in "$RUNNER_TEMP"/spirv-$run/*.vert "$RUNNER_TEMP"/spirv-$run/*.frag; do
              "$glslc" --target-env=vulkan1.1 -O0 "$source" -o "$source.spv"
            done
          done
          count=0
          for spv in "$RUNNER_TEMP"/spirv-a/*.spv; do
            name="$(basename "$spv")"
            cmp "$spv" "$RUNNER_TEMP/spirv-b/$name"
            cmp "$spv" "build/native/generated/vulkan-shaders/$name"
            count=$((count + 1))
          done
          # Five Vulkan programs, each with vertex and fragment stages.
          test "$count" -eq 10
          cmp "$RUNNER_TEMP/spirv-a/bindings.json" build/native/generated/vulkan-shaders/bindings.json
          echo "SPIR-V reproducible: $count stages"

      - name: Vulkan foundation runtime gate
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          set -euo pipefail
          xvfb-run -a build/native/FruityPrime -vulkancheck -noupdate 2>&1 | tee build/native/vulkan-foundation.log
          grep -F 'foundation PASS; clean shutdown; validation=1' build/native/vulkan-foundation.log

      - name: Vulkan resource runtime gate
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          set -euo pipefail
          xvfb-run -a build/native/FruityPrime -vulkanresourcecheck -noupdate 2>&1 | tee build/native/vulkan-resources.log
          grep -F 'resources PASS; buffer upload/copy/readback; texture upload/readback/resize; transitions; live=0; validation=1; errors=0' build/native/vulkan-resources.log

      - name: Vulkan presentation runtime gate
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" bash -lc '
            set -euo pipefail
            openbox --sm-disable > build/native/openbox.log 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid 2>/dev/null || true" EXIT
            sleep 1
            build/native/FruityPrime -vulkanpresentcheck -noupdate 2>&1 | tee build/native/vulkan-presentation.log
            build/native/FruityPrime -vulkanpresentfallbackcheck -noupdate 2>&1 | tee build/native/vulkan-presentation-fallback.log
          '
          grep -F 'presentation PASS; clear present; resize; fullscreen; minimize/restore; clean shutdown; validation=1; errors=0' build/native/vulkan-presentation.log
          grep -F 'presentation PASS; clear present; resize; fullscreen; minimize/restore; clean shutdown; validation=1; errors=0' build/native/vulkan-presentation-fallback.log
          grep -E 'fallback-retired-releases=[1-9][0-9]*' build/native/vulkan-presentation-fallback.log

      - name: Archive installed Qt application
        shell: bash
        run: tar -C build/native/dist -czf build/native/FruityPrime-linux.tar.gz .

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-linux-${{ github.run_number }}
          if-no-files-found: error
          path: build/native/FruityPrime-linux.tar.gz

      # What a dedicated server and the server directory run, and what they
      # download when they update themselves: the binary with its whole
      # library closure, glibc included, since the server boxes run older
      # distributions than this runner. The script says more.
      - name: Package the dedicated server
        shell: bash
        run: tools/package-server-linux.sh build/native/dist build/native/server/FruityPrime-server-linux-x64.tar.gz

      - name: Dedicated server startup contract (from the package)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server-x64"
          tar -C "$RUNNER_TEMP/server-x64" -xzf build/native/server/FruityPrime-server-linux-x64.tar.gz
          tools/check-dedicated-server.sh "$RUNNER_TEMP/server-x64"

      - name: Upload Linux dedicated server
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-server-linux-x64-${{ github.run_number }}
          if-no-files-found: error
          path: build/native/server/FruityPrime-server-linux-x64.tar.gz

  # The Pi runs the server directory (net.livetek.fr:27889) and a game server,
  # and it is arm64. It only ever runs -server and -masterserver, so this is
  # the Linux build without the GPU gates, packaged the same way as x64.
  linux-arm64-server:
    name: Linux arm64 / dedicated server
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Select compiler cache generation
        shell: bash
        run: echo "COMPILER_CACHE_WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-gcc-server-${{ env.COMPILER_CACHE_WEEK }}
          max-size: 500M
          append-timestamp: false

      # The x64 job's list, less the Vulkan SDK: with no Vulkan found the
      # optional backend is left out, and a server draws nothing.
      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            p7zip-full \
            libarchive-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libgl-dev \
            libglx-dev \
            libopengl-dev \
            libegl-dev \
            libglfw3-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libopenal-dev \
            libicu-dev

      - name: Install Qt Quick
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qt/install-qt.py --kit gcc_arm64 --root "$RUNNER_TEMP/qt"
          echo "QT_ROOT=$RUNNER_TEMP/qt/6.11.2/gcc_arm64" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${QT_ROOT}" \
            -DFRUITY_RELEASE_VERSION="${FRUITY_RELEASE_VERSION}"

      - name: Build C++ FruityPrime
        shell: bash
        run: cmake --build build/native --config RelWithDebInfo --parallel "$(nproc)" --target fruity_package

      - name: Package the dedicated server
        shell: bash
        run: tools/package-server-linux.sh build/native/dist build/native/server/FruityPrime-server-linux-arm64.tar.gz

      - name: Dedicated server startup contract (from the package)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server-arm64"
          tar -C "$RUNNER_TEMP/server-arm64" -xzf build/native/server/FruityPrime-server-linux-arm64.tar.gz
          tools/check-dedicated-server.sh "$RUNNER_TEMP/server-arm64"

      - name: Upload arm64 dedicated server
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-server-linux-arm64-${{ github.run_number }}
          if-no-files-found: error
          path: build/native/server/FruityPrime-server-linux-arm64.tar.gz

  macos:
    name: macOS / Clang
    runs-on: macos-15

    steps:
      - name: Checkout C++ source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up pinned macOS vcpkg
        id: vcpkg
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fruity-vcpkg"
          git init "$root"
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --depth 1 origin 07f4812200df3d3c931c0c8a6081d3b21fe2bf9f
          git -C "$root" checkout --detach FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "compiler=$(clang++ --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binary archives
        id: native-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-deps-macos-v1-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-${{ hashFiles('tools/ci/dependencies/macos.txt') }}
          restore-keys: |
            native-deps-macos-v1-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-
            native-vcpkg-all-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf autoconf-archive automake libtool curl libarchive zlib glfw openal-soft vulkan-headers
          echo "CMAKE_PREFIX_PATH=$(brew --prefix curl);$(brew --prefix libarchive);$(brew --prefix zlib);$(brew --prefix glfw);$(brew --prefix openal-soft)" >> "$GITHUB_ENV"

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.vcpkg.outputs.root }}"
          if [[ "$(uname -m)" == "arm64" ]]; then
            triplet="arm64-osx"
          else
            triplet="x64-osx"
          fi
          packages=()
          while IFS= read -r package; do [[ -z "$package" ]] || packages+=("$package:$triplet"); done < tools/ci/dependencies/macos.txt
          if (( ${#packages[@]} )); then "$root/vcpkg" install "${packages[@]}" --clean-after-build; fi
          echo "FRUITY_NATIVE_PREFIX=$root/installed/$triplet" >> "$GITHUB_ENV"

      - name: Save macOS dependencies after install
        if: steps.native-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-deps-macos-v1-${{ runner.arch }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.compiler }}-${{ hashFiles('tools/ci/dependencies/macos.txt') }}

      # Refresh immutable snapshots weekly; avoid a full duplicate on every push.
      - name: Select compiler cache generation
        shell: bash
        run: echo "COMPILER_CACHE_WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-clang-game-${{ env.COMPILER_CACHE_WEEK }}
          max-size: 500M
          append-timestamp: false

      - name: Install Qt Quick
        shell: bash
        run: |
          set -euo pipefail
          brew install sevenzip
          python3 tools/qt/install-qt.py --kit clang_64 --root "$RUNNER_TEMP/qt"
          echo "QT_ROOT=$RUNNER_TEMP/qt/6.11.2/clang_64" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${QT_ROOT};${FRUITY_NATIVE_PREFIX};$CMAKE_PREFIX_PATH" \
            -DFRUITY_RELEASE_VERSION="${FRUITY_RELEASE_VERSION}"

      - name: Build C++ FruityPrime
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native --config RelWithDebInfo --parallel "$(sysctl -n hw.ncpu)" --target fruity_package

      - name: Reflex lifecycle, raw mouse and Morph Ball input regression
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/native --config RelWithDebInfo --target fruity_vulkan_reflex_tests fruity_raw_mouse_motion_tests fruity_native_touch_state_tests fruity_native_aim_rules_tests fruity_dialanche_native_collision_tests fruity_weavel_alt_form_parity_tests fruity_intent_touch_payload_tests
          ctest --test-dir build/native -C RelWithDebInfo -R '^FruityPrime\.(VulkanNvidiaReflex|RawMouseMotion|NativeTouchState|NativeAimRules|DialancheNativeCollision|WeavelAltFormParity|IntentTouchPayload)$' --output-on-failure --no-tests=error

      - name: Archive installed Qt application
        shell: bash
        run: tar -C build/native/dist -czf build/native/FruityPrime-macos.tar.gz .

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-macos-${{ github.run_number }}
          if-no-files-found: error
          path: build/native/FruityPrime-macos.tar.gz

  android:
    uses: ./.github/workflows/native-cpp-android.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}

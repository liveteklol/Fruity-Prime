name: Native C++ Android

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or commit to build
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.cache/android-sdk
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

jobs:
  android_contract:
    name: Android native build contract
    runs-on: ubuntu-24.04
    outputs:
      abis: ${{ steps.contract.outputs.abis }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Export repository Android build contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          contract_file="$RUNNER_TEMP/fruity-native-android.env"
          rm -f "$contract_file"
          cmake -DOUTPUT_FILE="$contract_file" -P cmake/ExportAndroidConfig.cmake
          cat "$contract_file"
          abis_text="$(sed -n 's/^FRUITY_ANDROID_ABIS=//p' "$contract_file")"
          test -n "$abis_text"
          abis_json="$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1].split(), separators=(",", ":")))' "$abis_text")"
          test "$abis_json" != "[]"
          echo "abis=$abis_json" >> "$GITHUB_OUTPUT"

  android-native:
    name: Android NDK / ${{ matrix.abi }}
    needs: android_contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.android_contract.outputs.abis) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Load repository Android build contract
        shell: bash
        run: |
          set -euo pipefail
          cmake -DOUTPUT_FILE="$GITHUB_ENV" -P cmake/ExportAndroidConfig.cmake

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore pinned Android SDK and NDK cache
        id: android-sdk-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: native-android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-cmdline-12266719-${{ hashFiles('cmake/FruityNativeConfig.cmake', '.github/workflows/native-cpp-android.yml') }}
          restore-keys: |
            native-android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-cmdline-12266719-
            native-android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          ndk_home="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -f "${ndk_home}/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "$GITHUB_ENV"

      - name: Save pinned Android SDK and NDK cache
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: native-android-sdk-v2-${{ runner.os }}-${{ runner.arch }}-cmdline-12266719-${{ hashFiles('cmake/FruityNativeConfig.cmake', '.github/workflows/native-cpp-android.yml') }}

      - name: Locate vcpkg
        id: vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VCPKG_INSTALLATION_ROOT:-}" && -x "${VCPKG_INSTALLATION_ROOT}/vcpkg" ]]; then
            root="${VCPKG_INSTALLATION_ROOT}"
          else
            root="${RUNNER_TEMP}/vcpkg"
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$root"
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Android vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-android-vcpkg-v1-${{ matrix.abi }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('.github/workflows/native-cpp-android.yml') }}
          restore-keys: |
            native-android-vcpkg-v1-${{ matrix.abi }}-${{ steps.vcpkg.outputs.commit }}-
            native-android-vcpkg-v1-${{ matrix.abi }}-

      - name: Install Android runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.abi }}" in
            arm64-v8a) triplet="arm64-android" ;;
            x86_64) triplet="x64-android" ;;
            *) echo "Unsupported Android ABI: ${{ matrix.abi }}" >&2; exit 1 ;;
          esac
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> "$GITHUB_ENV"
          "${{ steps.vcpkg.outputs.root }}/vcpkg" install \
            "curl:${triplet}" \
            "libarchive[core,bzip2,crypto,lz4,lzma,zstd]:${triplet}" \
            "zlib:${triplet}" \
            "freetype:${triplet}" \
            "libjpeg-turbo:${triplet}" \
            "vulkan-memory-allocator:${triplet}" \
            --clean-after-build

      - name: Save Android vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: native-android-vcpkg-v1-${{ matrix.abi }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('.github/workflows/native-cpp-android.yml') }}

      # Refresh immutable snapshots weekly; avoid a full duplicate on every push.
      - name: Select compiler cache generation
        shell: bash
        run: echo "COMPILER_CACHE_WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-ccache-android-${{ matrix.abi }}-${{ env.COMPILER_CACHE_WEEK }}
          max-size: 500M
          append-timestamp: false

      - name: Configure and build shared library
        shell: bash
        run: |
          set -euo pipefail
          abi="${{ matrix.abi }}"
          build_dir="build/native-android-${abi}"
          vcpkg_root="${{ steps.vcpkg.outputs.root }}"
          mkdir -p "$build_dir"

          cmake -S . -B "$build_dir" \
            -DCMAKE_TOOLCHAIN_FILE="${vcpkg_root}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET="${VCPKG_TARGET_TRIPLET}" \
            -DANDROID_ABI="$abi" \
            -DANDROID_PLATFORM="android-${ANDROID_MIN_API}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee "$build_dir/configure.log"

          cmake --build "$build_dir" \
            --config RelWithDebInfo \
            --parallel "$(nproc)" \
            --verbose \
            --target fruity_mphread_native_android 2>&1 | tee "$build_dir/build.log"

          test -f "$build_dir/libFruityPrime.so"
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d "$build_dir/libFruityPrime.so" | tee "$build_dir/readelf-dynamic.log"

          # Both renderers in the one library: GLES as before, and the shared
          # Vulkan backend with its SPIR-V and the Android surface path.
          grep -F -- '-- Android Vulkan backend: on' "$build_dir/configure.log"
          test "$(ls "$build_dir"/generated/vulkan-shaders/*.spv | wc -l)" -eq 10
          nm="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nm" -C --defined-only "$build_dir/libFruityPrime.so" > "$build_dir/symbols.txt"
          for symbol in 'Rhi::AttachSceneSurface' 'Rhi::Vulkan::CreateSurfaceSwapchain' 'Rhi::Vulkan::WindowUi::DrawTexture' 'Rhi::OpenGL::ContextDevice'; do
            grep -qF "$symbol" "$build_dir/symbols.txt" || { echo "missing $symbol" >&2; exit 1; }
          done

      - name: Upload Android shared library
        uses: actions/upload-artifact@v4
        with:
          name: native-cpp-android-so-${{ matrix.abi }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: build/native-android-${{ matrix.abi }}/libFruityPrime.so

      - name: Upload Android native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cpp-android-diagnostics-${{ matrix.abi }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/native-android-${{ matrix.abi }}/CMakeCache.txt
            build/native-android-${{ matrix.abi }}/CMakeFiles/CMakeConfigureLog.yaml
            build/native-android-${{ matrix.abi }}/configure.log
            build/native-android-${{ matrix.abi }}/build.log
            build/native-android-${{ matrix.abi }}/readelf-dynamic.log

  android-apk:
    name: Android APK
    needs: [android_contract, android-native]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Load repository Android build contract
        shell: bash
        run: |
          set -euo pipefail
          cmake -DOUTPUT_FILE="$GITHUB_ENV" -P cmake/ExportAndroidConfig.cmake

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android packaging SDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download native ABI libraries
        uses: actions/download-artifact@v5
        with:
          pattern: native-cpp-android-so-*
          path: native-artifacts

      - name: Assemble jniLibs tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/jniLibs
          for abi in $FRUITY_ANDROID_ABIS; do
            mkdir -p "android/app/src/main/jniLibs/$abi"
            library="$(find native-artifacts -path "*${abi}*" -name libFruityPrime.so -print -quit)"
            test -n "$library"
            cp "$library" "android/app/src/main/jniLibs/$abi/libFruityPrime.so"
          done
          find android/app/src/main/jniLibs -maxdepth 3 -type f -print

      - name: Resolve APK version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^cpp_v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ "$tag" =~ ^cpp_v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version_name="${major}.${minor}.${patch}"
            version_code=$((major * 1000000 + minor * 1000 + patch))
          else
            version_name="0.0.${GITHUB_RUN_NUMBER}-dev"
            version_code=$((GITHUB_RUN_NUMBER % 2000000000 + 1))
          fi
          echo "FRUITY_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "FRUITY_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          printf 'APK version: %s (%s)\n' "$version_name" "$version_code"

      - name: Restore stable development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fruity-prime-native-android-debug-keystore-v1

      - name: Ensure development signing key exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Fruity Prime,C=US"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"

          build_tools="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
          "$build_tools/aapt" dump badging "$apk" | tee app/build/outputs/apk/release/badging.txt

          cp "$apk" app/build/outputs/apk/release/FruityPrime.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FruityPrime-cpp-android-${{ github.run_number }}
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/FruityPrime.apk
